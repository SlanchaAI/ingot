name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install source checkers
        run: |
          python -m pip install -r requirements.txt -r requirements-lint.txt
          npm ci
      - name: Lint and type-check every source
        run: bash tests/verify_whole_lint.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ingot-mcp .
      - name: Run tests
        run: docker run --rm -v "$PWD:/app" -w /app ingot-mcp python -m pytest tests -q
      - name: Smoke test Compose and Langfuse TLS
        run: ./scripts/compose_smoke.sh
